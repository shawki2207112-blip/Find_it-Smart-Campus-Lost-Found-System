server:
  port: ${PORT:8080}

spring:
  application:
    name: findit
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/findit}
    username: ${SPRING_DATASOURCE_USERNAME:findit}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # "update" keeps the lab setup simple: the schema is created automatically on first start.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

findit:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    blacklist-cleanup-ms: 3600000
  match:
    threshold: 60
    weight:
      category: 30
      location: 25
      keyword: 30
      date: 15
  notification:
    channel: in-app
  stats:
    cache-ttl-seconds: 60
  seed:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    security-email: ${SECURITY_EMAIL:}
    security-password: ${SECURITY_PASSWORD:}
