<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categories - FindIt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<main class="container py-4">
    <div id="alerts"></div>
<h3>Categories</h3>
<form id="form" class="row g-2 mb-3">
    <div class="col-md-4"><input id="name" class="form-control" placeholder="New category name" maxlength="60" required></div>
    <div class="col-auto"><button class="btn btn-primary">Add</button></div>
</form>
<ul class="list-group" id="list"></ul>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/navbar.js"></script>
<script>
if (!Auth.require('ROLE_ADMIN')) throw new Error('redirect');
async function load() {
    try {
        const categories = await Api.get('/api/categories');
        document.getElementById('list').innerHTML = categories.map(c => '<li class="list-group-item d-flex justify-content-between">'
            + '<span>' + UI.esc(c.name) + '</span><span>'
            + '<button class="btn btn-sm btn-outline-secondary me-1" onclick="rename(' + c.id + ',\'' + UI.esc(c.name).replace(/'/g, '') + '\')">Rename</button>'
            + '<button class="btn btn-sm btn-outline-danger" onclick="remove(' + c.id + ')">Delete</button></span></li>').join('');
    } catch (err) {
        UI.error(err);
    }
}
async function rename(id, oldName) {
    const name = prompt('New name:', oldName);
    if (!name) return;
    try { await Api.put('/api/categories/' + id, {name}); load(); } catch (err) { UI.error(err); }
}
async function remove(id) {
    if (!confirm('Delete this category?')) return;
    try { await Api.del('/api/categories/' + id); load(); } catch (err) { UI.error(err); }
}
document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    try { await Api.post('/api/categories', {name: document.getElementById('name').value}); e.target.reset(); load(); } catch (err) { UI.error(err); }
});
load();
</script>
</body>
</html>
