<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications - FindIt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<main class="container py-4">
    <div id="alerts"></div>
<h3>Notifications</h3>
<ul class="list-group" id="list"></ul>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/navbar.js"></script>
<script>
if (!Auth.require()) throw new Error('redirect');
async function load() {
    try {
        const list = await Api.get('/api/notifications');
        document.getElementById('list').innerHTML = list.length === 0
            ? '<li class="list-group-item text-muted">No notifications.</li>'
            : list.map(n => '<li class="list-group-item d-flex justify-content-between align-items-center">'
                + '<div>' + (n.read ? '' : '<span class="badge bg-primary me-2">new</span>') + UI.esc(n.message)
                + '<div class="small text-muted">' + n.type + ' - ' + UI.date(n.createdAt) + '</div></div><div>'
                + (n.read ? '' : '<button class="btn btn-sm btn-outline-primary me-1" onclick="markRead(' + n.id + ')">Mark read</button>')
                + '<button class="btn btn-sm btn-outline-danger" onclick="remove(' + n.id + ')">Delete</button></div></li>').join('');
    } catch (err) {
        UI.error(err);
    }
}
async function markRead(id) {
    try { await Api.put('/api/notifications/' + id + '/read'); load(); } catch (err) { UI.error(err); }
}
async function remove(id) {
    try { await Api.del('/api/notifications/' + id); load(); } catch (err) { UI.error(err); }
}
load();
</script>
</body>
</html>
