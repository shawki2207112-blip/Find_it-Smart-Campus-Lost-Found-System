<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - FindIt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<main class="container py-4">
    <div id="alerts"></div>
<div class="row justify-content-center"><div class="col-md-5"><div class="card"><div class="card-body">
    <h3 class="mb-3">Login</h3>
    <form id="form">
        <div class="mb-3"><label class="form-label">Email</label>
            <input id="email" type="email" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Password</label>
            <input id="password" type="password" class="form-control" required></div>
        <button class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 mb-0 small">No account? <a href="/register.html">Register</a></p>
</div></div></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/navbar.js"></script>
<script>
document.getElementById('form').addEventListener('submit', async event => {
    event.preventDefault();
    try {
        const res = await Api.post('/api/auth/login', {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        });
        Auth.setToken(res.token);
        window.location.href = Auth.homePage();
    } catch (err) {
        UI.error(err);
    }
});
</script>
</body>
</html>
