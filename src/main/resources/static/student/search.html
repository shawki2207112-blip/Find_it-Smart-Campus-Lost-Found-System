<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search - FindIt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar"></div>
<main class="container py-4">
    <div id="alerts"></div>
<h3>Search items</h3>
<form id="filters" class="row g-2 mb-3">
    <div class="col-md-2"><select id="category" class="form-select"></select></div>
    <div class="col-md-2"><input id="location" class="form-control" placeholder="Location contains"></div>
    <div class="col-md-2"><select id="type" class="form-select">
        <option value="">Lost + found</option><option>LOST</option><option>FOUND</option></select></div>
    <div class="col-md-2"><select id="status" class="form-select">
        <option value="">Any status</option><option>REPORTED</option><option>MATCHED</option>
        <option>CLAIMED</option><option>VERIFIED</option><option>RETURNED</option></select></div>
    <div class="col-md-2"><input id="fromDate" type="date" class="form-control" title="From date"></div>
    <div class="col-md-2"><input id="toDate" type="date" class="form-control" title="To date"></div>
    <div class="col-12"><button class="btn btn-primary">Search</button></div>
</form>
<table class="table table-striped bg-white">
    <thead><tr><th>Title</th><th>Type</th><th>Category</th><th>Location</th><th>Date</th><th>Status</th></tr></thead>
    <tbody id="rows"></tbody>
</table>
<div class="d-flex justify-content-between">
    <button class="btn btn-outline-secondary btn-sm" id="prev">Previous</button>
    <span id="pageInfo" class="text-muted"></span>
    <button class="btn btn-outline-secondary btn-sm" id="next">Next</button>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/navbar.js"></script>
<script>
if (!Auth.require()) throw new Error('redirect');
let page = 0;
let lastPage = true;
async function load() {
    const params = new URLSearchParams({page, size: 10});
    ['category', 'location', 'type', 'status', 'fromDate', 'toDate'].forEach(id => {
        const value = document.getElementById(id).value;
        if (value) params.set(id, value);
    });
    try {
        const result = await Api.get('/api/items?' + params.toString());
        lastPage = result.last;
        document.getElementById('pageInfo').textContent = 'Page ' + (result.number + 1) + ' of ' + Math.max(result.totalPages, 1);
        document.getElementById('rows').innerHTML = result.content.length === 0
            ? '<tr><td colspan="6" class="text-muted">No items found.</td></tr>'
            : result.content.map(i => '<tr><td>' + UI.itemLink(i) + '</td><td>' + i.type + '</td><td>' + UI.esc(i.categoryName)
                + '</td><td>' + UI.esc(i.location) + '</td><td>' + UI.esc(i.eventDate) + '</td><td>' + UI.badge(i.status) + '</td></tr>').join('');
    } catch (err) {
        UI.error(err);
    }
}
document.getElementById('filters').addEventListener('submit', e => { e.preventDefault(); page = 0; load(); });
document.getElementById('prev').addEventListener('click', () => { if (page > 0) { page--; load(); } });
document.getElementById('next').addEventListener('click', () => { if (!lastPage) { page++; load(); } });
UI.fillCategories('category', true).then(load).catch(UI.error);
</script>
</body>
</html>
