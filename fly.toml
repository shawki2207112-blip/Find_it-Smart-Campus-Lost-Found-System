# Fly.io configuration (bonus second platform). See docs/DEPLOY_OTHER_PLATFORM.md.
# Replace "findit-REPLACE-ME" with a globally unique app name before running `fly launch --copy-config`.
app = "findit-REPLACE-ME"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  JWT_EXPIRATION_MS = "86400000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/actuator/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
